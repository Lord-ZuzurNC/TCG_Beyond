<!doctype html>
<html lang="en" data-theme="mocha">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<script>
			// Applied before first paint so the counter never flashes the wrong theme.
			(() => {
				const VALID = ['latte', 'frappe', 'macchiato', 'mocha'];
				let theme;
				try {
					const param = new URLSearchParams(location.search).get('theme');
					theme = VALID.includes(param) ? param : localStorage.getItem('tcgb-theme');
				} catch {
					theme = null;
				}
				if (!VALID.includes(theme)) {
					theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'latte' : 'mocha';
				}
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
